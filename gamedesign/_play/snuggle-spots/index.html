<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snuggle Spots</title>
<style>
@font-face{font-family:'Lilita One';src:url(assets/lilita.woff2) format('woff2');font-display:block}
@font-face{font-family:Fredoka;font-weight:500;src:url(assets/fredoka500.woff2) format('woff2');font-display:block}
@font-face{font-family:Fredoka;font-weight:600;src:url(assets/fredoka600.woff2) format('woff2');font-display:block}
@font-face{font-family:Fredoka;font-weight:700;src:url(assets/fredoka700.woff2) format('woff2');font-display:block}
</style>
<style>
:root{--cocoa:#4a2e2a;--cream:#fff6ea;--latte:#f2d6bf;--gold:#ffc93c;--green:#5bd67a;--red:#ff5a6a;--peach:#ffb27a;--lav:#b79cff;--mint:#7fe3c4;--sky:#7cc8ff;--butter:#ffe07a;--rose:#ff8fb1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2b1a17;font-family:Fredoka,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:390px;height:844px;overflow:hidden;transform-origin:center center;background:#2b1a17;flex:none}
.lilita{font-family:'Lilita One',system-ui,sans-serif;font-weight:400}
.ol2{-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill}
.ol3{-webkit-text-stroke:3px var(--cocoa);paint-order:stroke fill}
.abs{position:absolute}
img{display:block;-webkit-user-drag:none;pointer-events:none}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:80}

/* buttons (UI/Button) */
.btn{position:absolute;border:0;border-radius:26px;font-family:'Lilita One';color:#fff;font-size:34px;letter-spacing:.5px;cursor:pointer;
  -webkit-text-stroke:2px rgba(74,46,42,.55);paint-order:stroke fill;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.45),0 6px 0 var(--cocoa),0 10px 16px rgba(43,26,23,.35);
  transition:transform .08s ease-out;display:flex;align-items:center;justify-content:center;gap:8px;outline:none}
.btn.green{background:linear-gradient(#8ff0a1,#4fcf6d 55%,#3cb85a)}
.btn.orange{background:linear-gradient(#ffc98a,#ff9f47 55%,#f2852a)}
.btn.blue{background:linear-gradient(#a6dcff,#58b6f5 55%,#3d9ee6)}
.btn.pink{background:linear-gradient(#ffb3cc,#ff7aa6 55%,#ef5d90)}
.btn.press{transform:translateY(4px) scale(.94)}
.btn.rel{animation:btnRel .32s cubic-bezier(.3,1.8,.5,1)}
@keyframes btnRel{0%{transform:translateY(4px) scale(.94)}60%{transform:scale(1.05)}100%{transform:none}}
.btn small{font-family:Fredoka;font-size:12px;font-weight:700;-webkit-text-stroke:0}
.round{position:absolute;border-radius:16px;background:linear-gradient(#8fd2ff,#3d9ee6);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 4px 0 var(--cocoa);border:0;color:#fff;font-family:'Lilita One';display:flex;align-items:center;justify-content:center}

/* splash */
#splash .warm{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,214,170,.15),rgba(74,46,42,.45))}
.bar{position:absolute;left:55px;top:740px;width:280px;height:26px;border-radius:13px;background:rgba(74,46,42,.5)}
.bar i{position:absolute;left:3px;top:3px;height:20px;border-radius:10px;background:linear-gradient(90deg,#ffe07a,#ffb27a);width:0;transition:width .2s}

/* home */
.topshade{position:absolute;left:0;top:0;width:390px;height:120px;background:linear-gradient(rgba(43,26,23,.55),rgba(43,26,23,0))}
.counter{position:absolute;top:52px;width:122px;height:52px;border-radius:26px;background:rgba(74,46,42,.72);border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;padding-left:44px;font-weight:700;font-size:19px;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill}
.counter img{position:absolute;left:-4px;top:-2px;height:54px}
.counter .plus{position:absolute;right:5px;top:10px;width:28px;height:28px;-webkit-text-stroke:0;border-radius:50%;background:linear-gradient(#8ff0a1,#3cb85a);font-family:'Lilita One';font-size:26px;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.glow{position:absolute;left:25px;top:270px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,170,.75),rgba(255,200,140,0) 70%)}
.side{position:absolute;width:72px;text-align:center;font-weight:700;font-size:14px;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill;cursor:pointer}
.side .bub{width:68px;height:68px;border-radius:34px;background:linear-gradient(#fff6ea,#f2d6bf);border:3px solid var(--cocoa);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--cocoa)}
.side .bub img{height:50px}
.side .dot{position:absolute;right:2px;top:-2px;width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid #fff}
.leveltag{position:absolute;left:120px;top:604px;width:150px;height:40px;border-radius:20px;background:rgba(74,46,42,.75);font-family:'Lilita One';font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav{position:absolute;left:0;top:748px;width:390px;height:96px;background:linear-gradient(#fff6ea,#f2d6bf);border-top:3px solid var(--cocoa);border-radius:26px 26px 0 0}
.nav .it{position:absolute;top:0;width:78px;height:96px;display:flex;flex-direction:column;align-items:center;color:var(--cocoa);font-weight:700;font-size:13px;padding-top:10px;gap:4px}
.nav .it img{height:40px}
.nav .act{top:-18px;height:82px;border-radius:24px;background:linear-gradient(#ffd08a,#ff9f47);border:3px solid var(--cocoa);color:#fff;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill;padding-top:6px}
.nav .act img{height:40px}

/* gameplay */
.tint{position:absolute;inset:0;background:rgba(255,241,226,.25)}
.hud-title{position:absolute;left:0;top:50px;width:390px;text-align:center;font-size:26px}
.hud-sub{position:absolute;left:0;top:82px;width:390px;text-align:center;font-weight:700;font-size:14px}
.heart{position:absolute;top:58px;width:30px;transition:transform .2s}
.heart.dead{filter:grayscale(1) brightness(.75) opacity(.55)}
.goal{position:absolute;left:40px;top:130px;width:310px;height:40px;border-radius:20px;background:rgba(74,46,42,.78);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;text-align:center;padding:0 10px;transition:background .3s}
.goal.flash{animation:gflash .9s}
@keyframes gflash{30%{background:rgba(255,90,106,.92);transform:scale(1.04)}}
.board{position:absolute;left:14px;top:190px;width:362px;height:362px;border-radius:26px;background:var(--cream);border:4px solid var(--cocoa);box-shadow:0 8px 0 rgba(74,46,42,.35),0 18px 30px rgba(43,26,23,.3)}
.cells{position:absolute;left:7px;top:7px}
.cell{position:absolute;border-radius:11px;cursor:pointer;transition:filter .15s}
.cell .base{position:absolute;inset:0;border-radius:11px;background:var(--b)}
.cell .face{position:absolute;left:0;top:0;right:0;bottom:4px;border-radius:11px;background:var(--f);transition:background .3s}
.cell .face::after{content:"";position:absolute;left:10%;top:10%;width:46%;height:16%;border-radius:8px;background:rgba(255,255,255,.55)}
.cell .mk{position:absolute;inset:0;bottom:4px;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';color:rgba(74,46,42,.55);font-size:calc(var(--cs)*.42);pointer-events:none}
.cell .dot{position:absolute;left:50%;top:46%;width:18%;height:18%;margin:-9% 0 0 -9%;border-radius:50%;background:rgba(74,46,42,.28);pointer-events:none}
.cell.gold .face{box-shadow:inset 0 0 0 3px #ffc93c,0 0 12px rgba(255,201,60,.8)}
.cell.redflash .face{animation:redf .5s}
@keyframes redf{0%,60%{background:#ff5a6a}}
.cell.hint .face{animation:hintp 1s ease-in-out infinite}
@keyframes hintp{50%{box-shadow:0 0 0 4px #fff,0 0 22px 8px rgba(255,224,122,.95);filter:brightness(1.15)}}
.cell.peek .face{animation:peekp .5s ease-in-out 4 alternate}
@keyframes peekp{to{filter:brightness(1.25) saturate(1.4);box-shadow:0 0 0 3px #fff}}
.cell.blocked{cursor:default}
.cell.blocked .face{background:#e9dccb!important;box-shadow:inset 0 3px 6px rgba(74,46,42,.18)}
.cell .deco{position:absolute;left:8%;top:4%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.cell .treat{position:absolute;right:-4px;top:-6px;width:46%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:tbob 1.6s ease-in-out infinite}
@keyframes tbob{50%{transform:translateY(-3px) rotate(6deg)}}
.cat{position:absolute;pointer-events:none;transform-origin:50% 100%;z-index:5}
.cat img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(43,26,23,.35))}
.cat.idle img{animation:breath 2.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.02,.98)}}
.cat.sleep img{animation:sleep 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(43,26,23,.35)) brightness(.95)}
@keyframes sleep{0%,100%{transform:scale(1,.94) rotate(-3deg)}50%{transform:scale(1.02,.9) rotate(-3deg)}}
.zzz{position:absolute;font-family:'Lilita One';color:#fff;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill;font-size:16px;pointer-events:none;z-index:6;animation:zz 2.2s ease-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-30px) scale(1.2)}}
.timer{position:absolute;left:0;top:572px;width:390px;text-align:center;font-weight:700;font-size:18px}
.timer.warn{color:#ff8a95;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bbar{position:absolute;left:14px;top:640px;width:362px;height:128px;border-radius:28px;background:rgba(74,46,42,.72)}
.slot{position:absolute;top:12px;width:80px;height:88px;border-radius:22px;background:linear-gradient(#d7c6ff,#a98bf5);border:3px solid var(--cocoa);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 4px 0 var(--cocoa);cursor:pointer}
.slot .in{position:absolute;left:6px;top:5px;right:6px;bottom:10px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#f4eeff,#c9b6ff)}
.slot img{position:absolute;left:50%;top:46%;height:58px;transform:translate(-50%,-50%)}
.slot .badge{position:absolute;right:-8px;top:-10px;min-width:28px;height:28px;border-radius:14px;background:linear-gradient(#ff8a95,#ff5a6a);border:3px solid #fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.slot .badge.plus{background:linear-gradient(#8ff0a1,#3cb85a)}
.slot.active{box-shadow:0 0 0 4px #ffe07a,0 0 18px 6px rgba(255,224,122,.9),0 4px 0 var(--cocoa)}
.slot-l{position:absolute;top:740px;width:80px;text-align:center;font-weight:700;font-size:14px}
.shieldOn{position:absolute;left:14px;top:190px;width:362px;height:362px;border-radius:26px;box-shadow:0 0 0 5px rgba(124,200,255,.9),0 0 26px 10px rgba(124,200,255,.65);pointer-events:none;opacity:0;transition:opacity .3s}
.shieldOn.on{opacity:1;animation:sh 1.2s ease-in-out infinite}
@keyframes sh{50%{box-shadow:0 0 0 7px rgba(124,200,255,.9),0 0 36px 14px rgba(124,200,255,.5)}}
.combo{position:absolute;left:0;top:162px;width:390px;text-align:center;font-family:'Lilita One';font-size:26px;color:#ffe07a;-webkit-text-stroke:3px var(--cocoa);paint-order:stroke fill;opacity:0;pointer-events:none;z-index:20}
.combo.go{animation:combo .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes combo{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}

/* tutorial */
.tut{position:absolute;left:16px;right:16px;bottom:16px;z-index:60;background:var(--cream);color:var(--cocoa);border:4px solid var(--cocoa);border-radius:26px;padding:16px 16px 14px 104px;min-height:120px;box-shadow:0 8px 0 rgba(74,46,42,.35);display:none;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.tut.on{display:block}
.tut img.tcat{position:absolute;left:8px;bottom:8px;width:90px}
.tut h4{font-family:'Lilita One';font-size:22px;font-weight:400;line-height:1.05}
.tut p{font-weight:600;font-size:15px;line-height:1.3;margin-top:6px}
.tut .next{position:relative;margin-top:10px;width:140px;height:46px;font-size:22px;border-radius:18px;left:auto;top:auto}
.tut .step{position:absolute;right:14px;top:12px;font-weight:700;font-size:12px;opacity:.6}
.hand{position:absolute;z-index:70;width:72px;pointer-events:none;display:none;filter:drop-shadow(0 6px 6px rgba(43,26,23,.45));transform-origin:6% 4%}
.hand.on{display:block;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(10px,14px) scale(1)}45%{transform:translate(14px,20px) scale(1.06)}60%{transform:translate(0,0) scale(.9)}75%{transform:translate(0,0) scale(.9)}}
.spot{position:absolute;z-index:55;border-radius:14px;box-shadow:0 0 0 2000px rgba(43,26,23,.55);pointer-events:none;transition:all .35s cubic-bezier(.3,1.3,.5,1);display:none}
.spot.on{display:block}
.board.focus .cell:not(.foc) .face,.board.focus .cell:not(.foc) .base{filter:brightness(.55) saturate(.4)}
.board.focus .cell.foc{animation:focp .7s ease-in-out infinite alternate}
@keyframes focp{to{transform:scale(1.07)}}
.cell.foc.bad .face{background:#ff8a95!important}
.hl{position:absolute;border-radius:11px;z-index:56;pointer-events:none;box-shadow:0 0 0 3px #fff,0 0 16px 4px rgba(255,255,255,.85);animation:hlp .8s ease-in-out infinite alternate}
.hl.bad{box-shadow:0 0 0 3px #ff5a6a,0 0 16px 4px rgba(255,90,106,.8);background:rgba(255,90,106,.25)}
@keyframes hlp{to{transform:scale(1.06)}}

/* popups */
.ov{position:absolute;inset:0;z-index:90;display:none}
.ov.on{display:block}
.ov .dim{position:absolute;inset:0;background:rgba(43,26,23,.6);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:absolute;left:30px;width:330px;border-radius:30px;background:linear-gradient(#fff6ea,#f6e3cf);border:4px solid var(--cocoa);box-shadow:0 10px 0 rgba(74,46,42,.45),0 22px 40px rgba(0,0,0,.35);color:var(--cocoa);animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.ribbon{position:absolute;height:74px;z-index:2;animation:popin .5s .05s cubic-bezier(.3,1.6,.5,1) both}
.ribbon .band{position:absolute;left:22px;right:22px;top:4px;height:62px;border-radius:14px;background:linear-gradient(#ff9fc0,#ef5d90);border:4px solid var(--cocoa);display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:32px;color:#fff;-webkit-text-stroke:2px rgba(74,46,42,.6);paint-order:stroke fill;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.ribbon .end{position:absolute;top:18px;width:44px;height:50px;background:#d9467a;border:4px solid var(--cocoa);z-index:-1}
.ribbon .end.l{left:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
.ribbon .end.r{right:0;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
.xbtn{position:absolute;width:44px;height:44px;border-radius:22px;background:linear-gradient(#ff8a95,#ff5a6a);border:3px solid var(--cocoa);color:#fff;font-family:'Lilita One';font-size:28px;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill}
.pglow{position:absolute;left:65px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,224,122,.9),rgba(255,224,122,0) 70%)}
.ptxt{position:absolute;color:var(--cocoa);left:20px;right:20px;text-align:center;font-weight:700;font-size:18px;line-height:1.25}
.toast{position:absolute;left:50%;top:566px;transform:translateX(-50%);background:rgba(74,46,42,.9);padding:8px 16px;border-radius:16px;font-weight:700;font-size:15px;white-space:nowrap;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* win */
#win{background:#2b1a17}
#win .warm{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,214,140,.55),rgba(43,26,23,.6) 75%)}
.rays{position:absolute;left:-115px;top:60px;width:620px;height:620px;opacity:.85;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.star{position:absolute;width:100px;height:100px;transform:scale(0)}
.star svg{width:100%;height:100%;overflow:visible}
.star.go{animation:starIn .55s cubic-bezier(.3,1.9,.5,1) forwards}
@keyframes starIn{to{transform:scale(1) rotate(var(--r,0deg))}}
.star.off svg path{fill:#a99282}
.rew{position:absolute;top:540px;left:30px;width:330px;height:120px;border-radius:24px;background:rgba(74,46,42,.55);border:3px solid rgba(255,255,255,.2)}
.rew .r{position:absolute;top:12px;width:104px;text-align:center;font-family:'Lilita One';font-size:18px;-webkit-text-stroke:2px var(--cocoa);paint-order:stroke fill}
.rew .r img{height:62px;margin:0 auto 8px}

/* level list */
.levels{position:absolute;left:30px;top:150px;width:330px;height:520px}
.lv{position:absolute;width:86px;height:96px;border-radius:24px;background:linear-gradient(#fff6ea,#f2d6bf);border:3px solid var(--cocoa);box-shadow:0 4px 0 var(--cocoa);color:var(--cocoa);text-align:center;cursor:pointer}
.lv b{display:block;font-family:'Lilita One';font-weight:400;font-size:28px;margin-top:8px}
.lv small{font-weight:700;font-size:11px;display:block;line-height:1.1;padding:0 4px}
.lv .st{position:absolute;left:0;right:0;bottom:-12px;font-size:14px;letter-spacing:-2px}
.lv.lock{filter:grayscale(.8) opacity(.6)}
.lv.cur{background:linear-gradient(#ffe7a6,#ffc93c);animation:pulse 1.2s infinite}

/* mini-game */
#mini{background:#2b1a17}
.mhud{position:absolute;left:16px;right:16px;top:52px;height:52px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mpill{background:rgba(74,46,42,.8);border-radius:24px;padding:6px 16px;font-family:'Lilita One';font-size:24px;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.2)}
.mpill img{height:32px}
.mprog{position:absolute;left:40px;right:40px;top:116px;height:22px;border-radius:11px;background:rgba(74,46,42,.6);z-index:5;border:2px solid rgba(255,255,255,.25)}
.mprog i{position:absolute;left:2px;top:2px;bottom:2px;border-radius:9px;background:linear-gradient(90deg,#8ff0a1,#3cb85a);width:0;transition:width .2s}
.mprog .mark{position:absolute;top:-6px;width:4px;height:30px;background:#ffe07a;border-radius:2px}
.basket{position:absolute;top:690px;width:120px;height:110px;z-index:4;transform:translateX(-50%)}
.basket img.b{position:absolute;left:0;bottom:0;width:120px}
.basket img.c{position:absolute;left:24px;bottom:30px;width:72px}
.drop{position:absolute;z-index:3;pointer-events:none}
.shakeS{animation:shk .35s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,0)}80%{transform:translate(3px,2px)}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

<!-- SPLASH -->
<section class="screen on" id="splash">
  <div class="bg" style="background-image:url(assets/bg_living.jpg)"></div><div class="warm"></div>
  <img class="abs" src="assets/logo.png" style="left:30px;top:110px;width:330px" id="spLogo">
  <img class="abs" src="assets/art_cat_cushion.png" style="left:35px;top:400px;width:320px" id="spCat">
  <div class="bar"><i id="spBar"></i></div>
  <div class="abs ol2" style="left:0;top:774px;width:390px;text-align:center;font-weight:700;font-size:18px" id="spTxt">Fluffing the cushions… 0%</div>
</section>

<!-- HOME -->
<section class="screen" id="home">
  <div class="bg" style="background-image:url(assets/bg_living.jpg)"></div><div class="topshade"></div>
  <div class="counter" style="left:8px"><img src="assets/ui_heart.png" style="height:46px;left:0;top:2px"><span id="hHearts">5</span><div class="plus">+</div></div>

   <button class="btn green" style="left:40px;top:500px;width:310px;height:84px" id="playMini">PLAY &amp; EARN</button>
   <button class="btn blue" style="left:70px;top:596px;width:250px;height:70px;font-size:26px" id="buyHint"><img src="${A('ui_gem')}" style="height:30px">10 · +3 hints</button>`);
  $('playMini').onclick = () => { closeOv(); mini(); };
  $('buyHint').onclick = () => { if (S.gems < 10) { toast('Not enough gems'); return; } S.gems -= 10; S.b.catnip += 3; save(); updBoosters(); closeOv(); SFX.coin(); };
}

/* ---------- out of hearts / time ---------- */
function outOfHearts() {
  G.over = true; SFX.lose(); clearInterval(G.ti);
  let sec = 899; overlay(`<div class="panel" style="top:220px;height:486px"></div>${ribbon('OUT OF HEARTS', 40, 186, 310)}<div class="xbtn" style="left:320px;top:204px">×</div>
   <img class="abs" src="${A('ui_heart')}" style="left:125px;top:290px;width:140px" id="bigHeart"><svg class="abs" style="left:182px;top:300px" width="26" height="96"><path d="M14 0 L4 30 L18 46 L6 70 L16 96" stroke="#4a2e2a" stroke-width="5" fill="none" stroke-linejoin="round"/></svg>
   <div class="abs" style="left:30px;top:440px;width:330px;text-align:center;font-weight:700;font-size:18px;color:#7a5a52">Next heart in</div>
   <div class="abs lilita" style="left:30px;top:462px;width:330px;text-align:center;font-size:40px;color:#ff5a6a" id="ohT">14:59</div>
   <button class="btn green" style="left:40px;top:522px;width:310px;height:84px" id="refill">REFILL <img src="${A('ui_gem')}" style="height:32px"> 25</button>
   <button class="btn orange" style="left:60px;top:618px;width:270px;height:72px;font-size:28px" id="adH">+1  WATCH AD</button>`, () => home());
  $('bigHeart').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], { duration: 600, iterations: Infinity, direction: 'alternate' });
  const iv = setInterval(() => { const e = $('ohT'); if (!e) return clearInterval(iv); sec--; e.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }, 1000);
  const resume = n => { clearInterval(iv); closeOv(); G.over = false; G.hearts = n; for (let i = 0; i < G.maxH; i++) $('h' + i).classList.toggle('dead', i >= n); G.ti = setInterval(tick, 250); };
  $('refill').onclick = () => { if (S.gems < 25) { toast('Not enough gems'); return; } S.gems -= 25; save(); resume(G.maxH); SFX.coin(); };
  $('adH').onclick = () => fakeAd(() => resume(1));
}
function timeUp() {
  G.over = true; clearInterval(G.ti); SFX.lose();
  overlay(`<div class="panel" style="top:250px;height:380px"></div>${ribbon('TIME\'S UP!', 45, 216, 300)}<div class="xbtn" style="left:320px;top:234px">×</div>
   <img class="abs" src="${A('cat_grey_british')}" style="left:135px;top:300px;height:130px"><div class="ptxt" style="top:440px">The cats fell asleep waiting…</div>
   <button class="btn green" style="left:40px;top:486px;width:310px;height:72px;font-size:28px" id="t30">+30s  WATCH AD</button>
   <button class="btn blue" style="left:70px;top:568px;width:250px;height:60px;font-size:24px" id="tRe">RETRY</button>`, () => home());
  $('t30').onclick = () => fakeAd(() => { closeOv(); G.over = false; G.t0 += 30000; G.ti = setInterval(tick, 250); });
  $('tRe').onclick = () => { closeOv(); start(G.L.id); };
}
pressable($('backBtn'), () => { if (G) { G.over = true; clearInterval(G.ti); } hideTut(); home(); });

/* ---------- WIN ---------- */
function win() {
  G.over = true; clearInterval(G.ti); hideTut();
  const stars = G.errors === 0 && G.hintsUsed === 0 ? 3 : G.errors <= 1 ? 2 : 1;
  const coins = 60 + G.N * 10 + stars * 10;
  // cats fall asleep, rays, confetti
  Object.entries(G.cats).forEach(([k, el], i) => setTimeout(() => { el.classList.remove('idle'); el.classList.add('sleep'); const z = document.createElement('div'); z.className = 'zzz'; z.textContent = 'z'; z.style.left = (parseFloat(el.style.left) + parseFloat(el.style.width) * .7) + 'px'; z.style.top = (parseFloat(el.style.top)) + 'px'; z.style.animationDelay = (i * .2) + 's'; $('cells').appendChild(z); }, i * 90));
  SFX.purr(); const b = rel($('board')); setTimeout(() => { ring(b.x, b.y, 120, 8); confettiRain(70); SFX.win(); }, 500);
  S.stars[G.L.id] = Math.max(S.stars[G.L.id] || 0, stars); S.level = Math.max(S.level, Math.min(G.L.id + 1, LEVELS.length)); S.coins += coins; save();
  setTimeout(() => {
    show('win'); $('wBg').style.backgroundImage = $('gBg').style.backgroundImage;
    $('wTitle').textContent = stars === 3 ? 'PURR-FECT!' : stars === 2 ? 'GREAT NAP!' : 'ALL SNUGGLED!';
    $('wCoins').textContent = '+' + coins; $('wNewCat').src = A(CATS[G.L.id % CATS.length]); $('wCatT').textContent = G.L.id % 3 === 0 ? 'NEW CAT' : '+1 TOY';
    const starSvg = '<svg viewBox="-55 -55 110 110"><path d="M0,-50 L14,-17 L49,-15 L22,8 L30,43 L0,24 L-30,43 L-22,8 L-49,-15 L-14,-17 Z" fill="#ffc93c" stroke="#4a2e2a" stroke-width="6" stroke-linejoin="round"/><path d="M-8,-28 L0,-44 L6,-28 Z" fill="#fff6c8"/></svg>';
    [1, 2, 3].forEach(i => { const e = $('s' + i); e.innerHTML = starSvg; e.className = 'star' + (i > stars ? ' off' : ''); setTimeout(() => { e.classList.add('go'); if (i <= stars) { SFX.star(i); const p = rel(e); glitter(p.x, p.y, 16); ring(p.x, p.y, 40, 4); vib(20); } }, 350 + i * 330); });
    $('wCat').animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1 }, { transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.3,1.5,.5,1)' });
    confettiRain(60);
    // coins fly
    setTimeout(() => { const from = rel($('wCoinIco')); for (let i = 0; i < 10; i++) setTimeout(() => { emit({ sprite: 'ui_coins', x: from.x + (Math.random() - .5) * 40, y: from.y, vx: (Math.random() - .5) * 4, vy: -8 - Math.random() * 4, g: .35, size: 28, decay: .018, add: false }); SFX.coin(); }, i * 70); }, 1500);
  }, 1500);
}
pressable($('contBtn'), () => { if (G.L.id < LEVELS.length) start(G.L.id + 1); else { toast('All levels done! 🐾'); home(); } });

/* ---------- TUTORIAL ---------- */
function hideHand() { $('hand').classList.remove('on'); }
function handAt(r, c) { const e = cellEl(r, c), p = rel(e); const h = $('hand'); h.style.left = (p.x - 3) + 'px'; h.style.top = (p.y - 2) + 'px'; h.classList.add('on'); }
function spotOn(x, y, w, h) { const s = $('spot'); s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.width = w + 'px'; s.style.height = h + 'px'; s.classList.add('on'); }
function hideTut() { $('tut').classList.remove('on'); $('spot').classList.remove('on'); hideHand(); clearHL(); if (G) { G.tutWaitX = null; G.tutAfterCat = null; } }
function clearHL() { document.querySelectorAll('.hl').forEach(e => e.remove()); $('board').classList.remove('focus'); document.querySelectorAll('.cell.foc').forEach(e => e.classList.remove('foc', 'bad')); }
function hlCells(list, bad) { $('board').classList.add('focus'); list.forEach(([r, c]) => { const e = cellEl(r, c); if (e) { e.classList.add('foc'); if (bad) e.classList.add('bad'); } }); const box = $('cells'); const { step, cs } = geo(); list.forEach(([r, c], i) => { const h = document.createElement('div'); h.className = 'hl' + (bad ? ' bad' : ''); h.style.cssText = `left:${c * step}px;top:${r * step}px;width:${cs}px;height:${cs}px;animation-delay:${i * .05}s`; box.appendChild(h); }); }
function tutCard(step, total, h, p, btn, onNext, cat) {
  const t = $('tut'); t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  $('tStep').textContent = step ? `${step}/${total}` : ''; $('tH').textContent = h; $('tP').innerHTML = p; $('tut').querySelector('.tcat').src = A(cat || 'cat_orange_tabby');
  const b = $('tNext'); b.style.display = btn ? 'flex' : 'none'; b.textContent = btn || ''; b.onclick = () => { SFX.tap(); onNext && onNext(); };
  meow(1.1, .08);
}
function tutRules() {
  const bx = rel($('board'));
  const zA = G.L.zones[0][0];
  const steps = [
    () => { clearHL(); spotOn(bx.x - bx.w / 2 - 6, bx.y - bx.h / 2 - 6, bx.w + 12, bx.h + 12); hlCells(zoneCells(zA)); tutCard(1, 4, 'One cat per cushion', 'Every colour is a cushion. Each cushion gets <b>exactly one</b> cat.', 'NEXT', next, 'cat_white_persian'); },
    () => { clearHL(); const r = 2; hlCells([...Array(G.N)].map((_, c) => [r, c])); setTimeout(() => { clearHL(); hlCells([...Array(G.N)].map((_, rr) => [rr, 2])); }, 1100); tutCard(2, 4, 'One cat per row & column', 'Every <b>row</b> and every <b>column</b> has exactly one cat.', 'NEXT', next, 'cat_tuxedo_wave'); },
    () => { clearHL(); const r = 2, c = 2; const nb = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (dr || dc) nb.push([r + dr, c + dc]); hlCells(nb, true); hlCells([[r, c]]); tutCard(3, 4, 'No cat neighbours', 'Cats need personal space: they <b>never touch</b>, not even corner to corner.', 'NEXT', next, 'cat_grey_british'); },
    () => { clearHL(); $('spot').classList.remove('on'); const [r, c] = G.L.order[0]; handAt(r, c); hlCells([[r, c]]); tutCard(4, 4, 'Tap twice to seat a cat', 'Tap once — <b>✕</b> (no cat here). Tap again — a cat jumps in!<br>Try this glowing spot.', '', null, 'cat_orange_tabby');
      G.tutAfterCat = (rr, cc) => { clearHL(); hideHand(); G.tutAfterCat = null; tutCard(0, 0, 'Purr-fect!', 'See the dots? The cat <b>blocks</b> its row, column, cushion and neighbours. Now finish the board!', 'PLAY', () => { hideTut(); S.tutDone[1] = 1; save(); setTimeout(() => { const n = nextHintCell(); if (n && !S.tutDone.hand2) { S.tutDone.hand2 = 1; handAt(...n); } }, 3000); }); }; }
  ];
  let i = 0; function next() { i++; if (i < steps.length) steps[i](); } steps[0]();
}
function tutTouch() {
  const [r, c] = G.L.order[0]; const nb = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if ((dr || dc) && r + dr >= 0 && c + dc >= 0 && r + dr < G.N && c + dc < G.N) nb.push([r + dr, c + dc]);
  tutCard(0, 0, 'Pro tip: use ✕ marks', 'Mark spots where a cat <b>can\'t</b> sit. When a cushion has only one free spot left — that\'s your cat! Stuck? Tap <b>Catnip</b>.', 'LET\'S GO', () => { hideTut(); S.tutDone[2] = 1; save(); const s = document.querySelector('.slot[data-b=catnip]'); s.classList.add('active'); setTimeout(() => s.classList.remove('active'), 3000); }, 'cat_cream_kitten');
}

/* ---------- MINI-GAME: Treat Catch ---------- */
let M = null;
function mini() {
  show('mini'); M = { score: 0, lives: 3, t0: Date.now(), dur: 20, items: [], over: false, x: 195, last: 0 };
  $('mScore').textContent = 0; $('mLives').textContent = '❤❤❤'; $('mBar').style.width = 0;
  const b = $('basket'); b.style.left = '195px';
  overlay(`<div class="panel" style="top:250px;height:330px"></div>${ribbon('TREAT CATCH', 45, 216, 300)}
   <img class="abs" src="${A('food_fish')}" style="left:70px;top:300px;height:70px"><img class="abs" src="${A('food_cupcake')}" style="left:160px;top:290px;height:80px"><img class="abs" src="${A('hw_bat')}" style="left:250px;top:300px;height:70px;filter:drop-shadow(0 0 0 #f00)">
   <div class="ptxt" style="top:385px;font-size:17px">Drag the basket · catch treats<br>Avoid bats 🦇 · <b>10 = +1 hint</b>, <b>18 = +2</b></div>
   <button class="btn green" style="left:70px;top:470px;width:250px;height:80px" id="mGo">START</button>`);
  $('mGo').onclick = () => { closeOv(); M.t0 = Date.now(); requestAnimationFrame(mloop); };
}
const mini_el = $('mini');
mini_el.addEventListener('pointermove', e => { if (!M) return; const s = stage.getBoundingClientRect(), k = s.width / 390; M.x = Math.max(60, Math.min(330, (e.clientX - s.left) / k)); });
mini_el.addEventListener('pointerdown', e => { if (!M) return; const s = stage.getBoundingClientRect(), k = s.width / 390; M.x = Math.max(60, Math.min(330, (e.clientX - s.left) / k)); });
function mloop() {
  if (!M || M.over) return; const now = Date.now(), el = (now - M.t0) / 1000, left = Math.max(0, M.dur - el);
  $('mTime').textContent = Math.ceil(left);
  const bk = $('basket'); const bx = parseFloat(bk.style.left); const nx = bx + (M.x - bx) * .35; bk.style.left = nx + 'px'; bk.style.transform = `translateX(-50%) rotate(${(M.x - bx) * .15}deg)`;
  const rate = 520 - el * 12;
  if (now - M.last > rate) { M.last = now; const bad = Math.random() < .22 + el * .006; const d = document.createElement('img'); d.className = 'drop'; d.src = A(bad ? 'hw_bat' : TREATS.concat(['food_kibble', 'food_milk'])[Math.floor(Math.random() * 7)]); const w = bad ? 64 : 56; d.style.width = w + 'px'; const it = { el: d, x: 30 + Math.random() * 330, y: 140, v: 2.6 + el * .14 + Math.random(), bad, w, rot: (Math.random() - .5) * 4 }; d.style.left = it.x - w / 2 + 'px'; d.style.top = it.y + 'px'; $('mini').appendChild(d); M.items.push(it); }
  M.items = M.items.filter(it => {
    it.y += it.v; it.el.style.top = it.y + 'px'; it.el.style.transform = `rotate(${it.y * it.rot}deg)`;
    if (it.y > 680 && it.y < 730 && Math.abs(it.x - nx) < 62) {
      it.el.remove();
      if (it.bad) { M.lives--; $('mLives').textContent = '❤'.repeat(M.lives) + '🖤'.repeat(3 - M.lives); SFX.error(); vib(40); stage.classList.remove('shakeS'); void stage.offsetWidth; stage.classList.add('shakeS'); emit({ sprite: 'vfx_heart_burst', x: nx, y: 700, size: 60, grow: 3, decay: .03 }); if (M.lives <= 0) endMini(); }
      else { M.score++; $('mScore').textContent = M.score; $('mBar').style.width = Math.min(100, M.score / 20 * 100) + '%'; SFX.pop(); puff(nx, 690, 3); glitter(nx, 680, 6); floatTxt(nx, 660, '+1', '#ffe07a', 22); bk.animate([{ transform: 'translateX(-50%) scale(1.15,.85)' }, { transform: 'translateX(-50%)' }], { duration: 200 }); if (M.score === 10 || M.score === 18) { SFX.zone(); ring(nx, 690, 60, 5); toast(M.score === 10 ? '+1 hint unlocked!' : '+2 hints!'); } }
      return false;
    }
    if (it.y > 860) { it.el.remove(); return false; }
    return true;
  });
  if (left <= 0) return endMini();
  requestAnimationFrame(mloop);
}
function endMini() {
  if (M.over) return; M.over = true; M.items.forEach(i => i.el.remove());
  const gain = M.score >= 18 ? 2 : M.score >= 10 ? 1 : 0; S.b.catnip += gain; save(); updBoosters();
  if (gain) { SFX.win(); confettiRain(50); } else SFX.lose();
  overlay(`<div class="panel" style="top:250px;height:340px"></div>${ribbon(gain ? 'YUM!' : 'SO CLOSE!', 45, 216, 300)}
   <img class="abs" src="${A(gain ? 'bst_catnip_hint' : 'cat_grey_british')}" style="left:140px;top:290px;height:120px">
   <div class="ptxt" style="top:420px">Caught <b>${M.score}</b> treats<br>${gain ? `+${gain} Catnip hint${gain > 1 ? 's' : ''}!` : 'Catch 10 to earn a hint'}</div>
   <div class="xbtn" style="left:320px;top:234px">×</div><button class="btn ${gain ? 'green' : 'orange'}" style="left:70px;top:500px;width:250px;height:72px;font-size:28px" id="mBack">${gain ? 'BACK TO PUZZLE' : 'TRY AGAIN'}</button>`);
  $('mBack').onclick = () => { closeOv(); if (gain) { show('game'); } else mini(); };
  const xb = $('ovBody').querySelector('.xbtn'); if (xb) xb.onclick = () => { closeOv(); show('game'); };
}
</script>
