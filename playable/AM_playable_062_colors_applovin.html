    if(m)return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
    if(c.charAt(0)==='#'){
      var hx=c.slice(1);
      if(hx.length===3)hx=hx[0]+hx[0]+hx[1]+hx[1]+hx[2]+hx[2];
      if(hx.length>=6){
        return parseInt(hx.substr(0,2),16)+','+parseInt(hx.substr(2,2),16)+','+parseInt(hx.substr(4,2),16);
      }
    }
    return '255,255,255';

    if(pinchActive){
      if(ev.touches.length===0){ pinchActive=false; lastPinchTime=Date.now(); }
      dragActive=false; dragMoved=false;
      return;
    }
    var t=ev.changedTouches&&ev.changedTouches.length?ev.changedTouches[0]:null;
    if(!t){ dragActive=false; dragMoved=false; return; }
    endDrag(t.clientX,t.clientY,true);
  }
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',function(){ dragActive=false; dragMoved=false; pinchActive=false; },{passive:true});
  window.addEventListener('resize',function(){ layout(); });
  window.addEventListener('orientationchange',function(){ setTimeout(layout,120); });
  for(var warmI=0;warmI<paths.length;warmI++){
    if(paths[warmI]&&paths[warmI].id)ensurePathRails(paths[warmI]);
  }
  layout();
  loop();
  armAudioGestures();   // звук/музыка — с первого жеста пользователя
  /* (Mintegral SDK hooks не нужны в этой сборке) */
})();
</script>
