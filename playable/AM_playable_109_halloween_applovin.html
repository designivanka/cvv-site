  #stage{position:fixed;inset:0;}

       padding:1.5vmin 4vmin calc(1.5vmin + env(safe-area-inset-bottom,0px));

  #hudLogo{cursor:pointer;width:auto;height:14vmin;max-height:110px;display:block;

var HW = (function(){
  function rng(seed){ var s = seed>>>0; return function(){ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

  /* ---------- фон: ночь, луна, звёзды, туман, кладбище, паутина по углам ---------- */
  function drawBackground(g, W, H, opt){
    opt = opt || {};
    var R = rng(1337), m = Math.min(W,H), i;
    var gr = g.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#2b1046'); gr.addColorStop(0.45,'#160a27'); gr.addColorStop(1,'#060309');
    g.fillStyle = gr; g.fillRect(0,0,W,H);
    /* звёзды */
    for(i=0;i<Math.round(W*H/9000);i++){
      var sx=R()*W, sy=R()*H*0.75, sr=(0.4+R()*1.3)*m/900;
      g.fillStyle='rgba(255,245,230,'+(0.25+R()*0.6).toFixed(2)+')';
      g.beginPath(); g.arc(sx,sy,sr,0,Math.PI*2); g.fill();
    }
    /* луна */
    var mx=W*0.84, my=H*0.2+m*0.05, mr=m*0.075;   /* луна ниже — сверху счётчик IQ */
    var halo=g.createRadialGradient(mx,my,mr*0.6,mx,my,mr*4.2);
    halo.addColorStop(0,'rgba(255,236,190,0.40)'); halo.addColorStop(0.35,'rgba(220,170,255,0.12)'); halo.addColorStop(1,'rgba(120,60,200,0)');
    g.fillStyle=halo; g.beginPath(); g.arc(mx,my,mr*4.2,0,Math.PI*2); g.fill();
    var disk=g.createRadialGradient(mx-mr*0.3,my-mr*0.3,mr*0.1,mx,my,mr);
    disk.addColorStop(0,'#fffdf0'); disk.addColorStop(0.7,'#f7e3a6'); disk.addColorStop(1,'#e2c27a');
    g.fillStyle=disk; g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(170,130,70,0.18)';
    var cr=[[-0.3,-0.2,0.18],[0.25,0.1,0.22],[-0.05,0.4,0.12],[0.35,-0.35,0.1]];
    for(i=0;i<cr.length;i++){ g.beginPath(); g.arc(mx+cr[i][0]*mr,my+cr[i][1]*mr,cr[i][2]*mr,0,Math.PI*2); g.fill(); }
    /* облака-дымка поперёк луны */
    function cloud(cx,cy,rw,rh,a){
      var cg=g.createRadialGradient(cx,cy,0,cx,cy,rw);
      cg.addColorStop(0,'rgba(120,90,170,'+a+')'); cg.addColorStop(1,'rgba(120,90,170,0)');
      g.save(); g.translate(cx,cy); g.scale(1,rh/rw); g.translate(-cx,-cy);
      g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,rw,0,Math.PI*2); g.fill(); g.restore();
    }
    cloud(W*0.80,H*0.2+m*0.06,m*0.28,m*0.05,0.22);
    cloud(W*0.25,H*0.2,m*0.35,m*0.06,0.14);
    cloud(W*0.6,H*0.32,m*0.4,m*0.05,0.08);
    /* кладбище внизу */
    var gy=H*0.9;
    g.fillStyle='#0d0716';
    g.beginPath(); g.moveTo(0,H); g.lineTo(0,gy);
    for(i=0;i<=24;i++){ var x=W*i/24; g.lineTo(x, gy - Math.sin(i*0.7)*m*0.018 - Math.sin(i*0.23+1)*m*0.03); }
    g.lineTo(W,H); g.closePath(); g.fill();
    var stones=[[0.08,1.0],[0.2,0.8],[0.74,0.9],[0.9,1.1],[0.62,0.6]];
    for(i=0;i<stones.length;i++){
      var tx=W*stones[i][0], tw=m*0.05*stones[i][1], th=m*0.075*stones[i][1], ty=gy-Math.sin(stones[i][0]*24*0.7)*m*0.018+m*0.01;
      g.fillStyle='#120a1e';
      g.beginPath(); g.moveTo(tx-tw/2,ty); g.lineTo(tx-tw/2,ty-th+tw/2); g.arc(tx,ty-th+tw/2,tw/2,Math.PI,0); g.lineTo(tx+tw/2,ty); g.closePath(); g.fill();
      g.fillStyle='rgba(140,110,190,0.18)'; g.fillRect(tx-tw*0.08,ty-th*0.75,tw*0.16,th*0.45); g.fillRect(tx-tw*0.25,ty-th*0.62,tw*0.5,tw*0.14);
    }
    /* голое дерево слева */
    g.strokeStyle='#0d0716'; g.lineCap='round';
    function branch(x,y,len,ang,wid,d){
      var x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
      g.lineWidth=wid; g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
      if(d<=0)return;
      branch(x2,y2,len*0.72,ang-0.45-R()*0.25,wid*0.62,d-1);
      branch(x2,y2,len*0.68,ang+0.35+R()*0.25,wid*0.62,d-1);
    }
    branch(W*0.035,H*0.97,m*0.16,-Math.PI/2+0.12,m*0.024,6);
    /* туман */
    var fog=g.createLinearGradient(0,H*0.78,0,H);
    fog.addColorStop(0,'rgba(140,100,190,0)'); fog.addColorStop(0.6,'rgba(140,100,190,0.16)'); fog.addColorStop(1,'rgba(90,60,140,0.10)');
    g.fillStyle=fog; g.fillRect(0,H*0.78,W,H*0.22);
    /* паутина по углам */
    if(opt.cornerWebs!==false){
      cornerWeb(g,0,0,m*0.30,0,0.24);
      cornerWeb(g,W,0,m*0.22,1,0.18);
    }
  }
  function cornerWeb(g,x,y,size,flip,a){
    var n=6, rings=6, i, k, ang0=flip?Math.PI/2:0, ang1=flip?Math.PI:Math.PI/2;
    g.save(); g.strokeStyle='rgba(235,230,255,'+a+')'; g.lineWidth=Math.max(1,size/220);
    var spokes=[];
    for(i=0;i<=n;i++){ var an=ang0+(ang1-ang0)*i/n; spokes.push(an); g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(an)*size, y+Math.sin(an)*size); g.stroke(); }
    for(k=1;k<=rings;k++){
      var rr=size*k/(rings+0.6);
      g.beginPath();
      for(i=0;i<n;i++){
        var a1=spokes[i], a2=spokes[i+1], am=(a1+a2)/2;
        var p1x=x+Math.cos(a1)*rr, p1y=y+Math.sin(a1)*rr, p2x=x+Math.cos(a2)*rr, p2y=y+Math.sin(a2)*rr;
        var cx=x+Math.cos(am)*rr*0.86, cy=y+Math.sin(am)*rr*0.86;
        if(i===0)g.moveTo(p1x,p1y);
        g.quadraticCurveTo(cx,cy,p2x,p2y);
      }
      g.stroke();
    }
    g.restore();
  }

  /* ---------- спрайт паутины (белый, прозрачный фон) ---------- */
  function makeWebSprite(size, seed, doc){
    var c=(doc||document).createElement('canvas'); c.width=c.height=size;
    var g=c.getContext('2d'), R=rng(seed||7), cx=size/2, cy=size/2, rad=size*0.47;
    var n=9+Math.floor(R()*3), i, k, sp=[];
    g.lineCap='round'; g.lineJoin='round';
    var rl=[]; for(i=0;i<n;i++){ sp.push(i/n*Math.PI*2 + (R()-0.5)*0.35); rl.push(rad*(0.86+R()*0.14)); }
    function strokeAll(lw, col){
      g.strokeStyle=col; g.lineWidth=lw;
      for(i=0;i<n;i++){ var r2=rl[i]; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(sp[i])*r2, cy+Math.sin(sp[i])*r2); g.stroke(); }
      var rings=6;
      for(k=1;k<=rings;k++){
        var rr=rad*(k/rings)*(0.92);
        g.beginPath();
        for(i=0;i<=n;i++){
          var a1=sp[i%n], a2=sp[(i+1)%n]; if(a2<a1)a2+=Math.PI*2;
          var am=(a1+a2)/2, p1x=cx+Math.cos(a1)*rr, p1y=cy+Math.sin(a1)*rr, p2x=cx+Math.cos(a2)*rr, p2y=cy+Math.sin(a2)*rr;
          if(i===0)g.moveTo(p1x,p1y);
          if(i<n) g.quadraticCurveTo(cx+Math.cos(am)*rr*0.82, cy+Math.sin(am)*rr*0.82, p2x,p2y);
        }
        g.stroke();
      }
    }
    var lw=Math.max(1,size/110);
    strokeAll(lw*3.2,'rgba(190,170,255,0.20)');   /* мягкое свечение */
    strokeAll(lw,'rgba(255,255,255,0.95)');
    /* капельки росы */
    R=rng((seed||7)+99);
    for(i=0;i<14;i++){
      var a=R()*Math.PI*2, r=rad*(0.2+R()*0.75);
      g.fillStyle='rgba(255,255,255,'+(0.6+R()*0.4).toFixed(2)+')';
      g.beginPath(); g.arc(cx+Math.cos(a)*r, cy+Math.sin(a)*r, lw*(1+R()*1.4), 0, Math.PI*2); g.fill();
    }
    return c;
  }

  /* ---------- тыква: заливка тела, рёбра, контур, лицо ---------- */
  function polyPath(g,pts,close){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]); if(close)g.closePath(); }
  function centroid(p){ var x=0,y=0,i; for(i=0;i<p.length;i++){x+=p[i][0];y+=p[i][1];} return [x/p.length,y/p.length]; }
  function arrowGradient(g){
    var gr=g.createLinearGradient(0,300,0,1760);
    gr.addColorStop(0,'#ff4a1c'); gr.addColorStop(0.45,'#ff8a1e'); gr.addColorStop(1,'#ffcf4d');
    return gr;
  }
  function drawPumpkinBack(g, L){
    /* тёплое свечение изнутри */
    var bg=g.createRadialGradient(1024,1150,80,1024,1150,900);
    bg.addColorStop(0,'rgba(255,120,20,0.16)'); bg.addColorStop(0.7,'rgba(200,60,10,0.07)'); bg.addColorStop(1,'rgba(120,20,0,0.03)');
    g.fillStyle=bg; polyPath(g,L.outline,true); g.fill();
  }
  function strokeNeon(g, pts, close, col, w){
    g.save(); g.lineJoin='round'; g.lineCap='round';
    g.globalCompositeOperation='lighter';
    polyPath(g,pts,close);
    g.strokeStyle='rgba(255,110,20,0.10)'; g.lineWidth=w*5; g.stroke();
    g.strokeStyle='rgba(255,130,30,0.20)'; g.lineWidth=w*2.4; g.stroke();
    g.globalCompositeOperation='source-over';
    g.strokeStyle=col; g.lineWidth=w; g.stroke();
    g.restore();
  }
  function drawOutline(g, L){
    var gr=arrowGradient(g);
    strokeNeon(g,L.outline,true,gr,7);
    strokeNeon(g,L.curl,false,gr,7);
  }
  function holes(L){ return [L.eyes[0],L.eyes[1],L.nose,L.mouth]; }
  /* свечение дырок: заранее отрисованный блюр в 1/4 размера */
  function makeFaceGlow(L, doc){
    var c=(doc||document).createElement('canvas'), k=0.25; c.width=c.height=512;
    var g=c.getContext('2d'), hs=holes(L), i, j;
    g.scale(k,k);
    for(j=0;j<3;j++){
      g.shadowColor='rgba(255,120,0,1)'; g.shadowBlur=[90,50,22][j]*k*4;
      for(i=0;i<hs.length;i++){ g.fillStyle=['rgba(255,90,0,0.55)','rgba(255,140,20,0.6)','rgba(255,200,80,0.6)'][j]; polyPath(g,hs[i],true); g.fill(); }
    }
    return c;
  }
  /* мерцание свечи: плавный «шум» из синусов */
  function flicker(t){
    return 0.82 + 0.08*Math.sin(t*0.0071) + 0.06*Math.sin(t*0.0173+1.3) + 0.04*Math.sin(t*0.041+0.4);
  }
  function drawFace(g, L, t, glowCanvas){
    var f=flicker(t), hs=holes(L), i;
    for(i=0;i<hs.length;i++){
      var c=centroid(hs[i]), r=(i===3?430:i===2?90:170);
      var gr=g.createRadialGradient(c[0],c[1]-r*0.1,r*0.05,c[0],c[1],r);
      gr.addColorStop(0,'rgba(255,250,200,'+f.toFixed(3)+')');
      gr.addColorStop(0.35,'rgba(255,196,64,'+f.toFixed(3)+')');
      gr.addColorStop(0.75,'rgba(255,110,10,'+(f*0.95).toFixed(3)+')');
      gr.addColorStop(1,'rgba(170,30,0,'+(f*0.9).toFixed(3)+')');
      g.fillStyle=gr; polyPath(g,hs[i],true); g.fill();
    }
    if(glowCanvas){
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=Math.min(1,0.55+(f-0.82)*2.2);
      g.drawImage(glowCanvas,0,0,2048,2048); g.restore();
    }
  }
  return { rng:rng, drawBackground:drawBackground, makeWebSprite:makeWebSprite, drawPumpkinBack:drawPumpkinBack,
           drawOutline:drawOutline, makeFaceGlow:makeFaceGlow, drawFace:drawFace, flicker:flicker,
           arrowGradient:arrowGradient, polyPath:polyPath, holes:holes, centroid:centroid };
})();

(function(){

     Первый вызов MRAID — строго getState()/addEventListener('ready'),
     до любого click-through. Ни один MRAID API не дёргается, пока не пришёл ready. */
  var MRAID_READY = false;
  (function mraidReadyGate(){
    if(!window.mraid) return;
    function onReady(){ MRAID_READY = true; }
    try{
      if(typeof mraid.getState === 'function' && mraid.getState() !== 'loading'){ onReady(); }
      else if(typeof mraid.addEventListener === 'function'){ mraid.addEventListener('ready', onReady); }
    }catch(e){}
  })();
  if(!DATA||!Array.isArray(DATA.paths)){ document.body.insertAdjacentHTML('beforeend','<p style="color:#f88;padding:16px">Нет данных в файле.</p>'); return; }
  function expandPlayablePath(p){
    if(!p)return null;
    if(Array.isArray(p.points)&&p.points.length>=2){
      var o=JSON.parse(JSON.stringify(p));
      if(o.id==null||o.id==='')o.id='x'+Math.random().toString(36).slice(2,11);
      else o.id=String(o.id);
      return o;
    }
    if(Array.isArray(p.p)&&p.p.length>=2){
      var idStr=p.i!=null&&p.i!==''?String(p.i):'x'+Math.random().toString(36).slice(2,11);
      var pts=[],ti,tq;
      for(ti=0;ti<p.p.length;ti++){
        tq=p.p[ti];
        pts.push({x:+tq[0],y:+tq[1]});
      }
      return{
        id:idStr,
        points:pts,
        mode:p.m||'grid',
        strokeColor:p.c!=null?p.c:'#e8b429',
        strokeGradient:p.cg||null,
        strokeWidth:p.w!=null?p.w:4,
        glow:p.g!=null?p.g:0,
        arrowheads:p.a

      p = paths[i]; pts = p.points;
      mid = pts[Math.floor(pts.length/2)] || pts[0];
      arr.push({ id:String(p.id), k: mid.y*10000 + mid.x });

    arr.sort(function(a,b){ return a.k - b.k; });
    var span = Math.max(0, INTRO_MS - INTRO_PATH_MS);
    var n = Math.max(1, arr.length - 1);
    for(i=0;i<arr.length;i++) introDelay[arr[i].id] = span * (i / n);

      if(running)return;
      var t0=Date.now();
      (function pulse(){
        var s=0.5+0.5*Math.sin((Date.now()-t0)/1200*Math.PI*2);
        var sc=(1+0.07*s).toFixed(3);

        for(i=0;i<btns.length;i++){

  /* ===== ПОДСКАЗКА: белая стрелка + рука + наезд камеры ===== */
  function easeInOutCubic(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  /* тап по полю: подсказка гаснет, камера плавно возвращается */

  }
  /* пользователь сам двигает камеру: гасим подсказку БЕЗ автовозврата, иначе камера "дерётся" */
  function cancelHint(){

  }
  function clampPan(px,py,sc){
    /* Свободное перетаскивание «за пальцем»: поле можно тащить куда угодно,
       на экране всегда остаётся хотя бы полоска карты (keep). Диапазон всегда
       валиден и содержит текущую позицию -> никаких рывков/перескоков. */
    var bb=mapBB||{x:0,y:0,w:w,h:h};
    var keep=Math.min(cw,ch)*0.18;
    var minX=keep-(bb.x+bb.w)*sc, maxX=cw-keep-bb.x*sc;
    if(minX>maxX){ var mx=(minX+maxX)/2; minX=mx; maxX=mx; }
    px=Math.min(maxX,Math.max(minX,px));
    var minY=keep-(bb.y+bb.h)*sc, maxY=ch-keep-bb.y*sc;
    if(minY>maxY){ var my=(minY+maxY)/2; minY=my; maxY=my; }
    py=Math.min(maxY,Math.max(minY,py));
    return { x:px, y:py };
  }
  function clampScale(){
    if(!(camScale>0))camScale=MIN_SCALE;
    if(camScale<MIN_SCALE)camScale=MIN_SCALE;
    if(camScale>MAX_SCALE)camScale=MAX_SCALE;
  }
  function clampCam(){
    clampScale();
    var c=clampPan(camPanX,camPanY,camScale);
    camPanX=c.x; camPanY=c.y;
  }
  /* центрирование камеры БЕЗ клампа по краям карты — чтобы подсказка была строго по центру */
  function applyCam(sc,cx,cy){
    camScale=sc; clampScale(); sc=camScale;
    camPanX=cw/2-sc*cx; camPanY=ch/2-sc*cy;
  }
  function currentCam(){
    return { scale:camScale, cx:(cw/2-camPanX)/camScale, cy:(ch/2-camPanY)/camScale };
  }
  var FIT_DY=0;
  function layout(){
    var dpr=Math.min(Math.max(window.devicePixelRatio||1,1),2.5);
    var cssW=Math.max(1,window.innerWidth||document.documentElement.clientWidth||w);
    var cssH=Math.max(1,window.innerHeight||document.documentElement.clientHeight||h);
    cw=Math.round(cssW*dpr); ch=Math.round(cssH*dpr);
    cv.width=cw; cv.height=ch;
    cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
    var bb=worldBBoxOfPaths();
    var pad=(+DATA.strokeWidth||6)*3+8;
    if(bb){ mapBB={x:bb.x-pad,y:bb.y-pad,w:bb.w+pad*2,h:bb.h+pad*2}; }
    else { mapBB={x:0,y:0,w:w,h:h}; }
    /* CONTAIN: весь уровень целиком помещается в кадр с отступом 4% по краям.
       Этот масштаб = baseScale = минимальный зум (ниже него отдалить нельзя). */
    var padFrac=0.04;
    var iqEl=document.getElementById('iq'), hudEl=document.getElementById('hud');
    var topPx=iqEl?iqEl.getBoundingClientRect().height*dpr:0, botPx=hudEl?hudEl.getBoundingClientRect().height*dpr*0.7:0;
    FIT_DY=(topPx-botPx)/2;
    fitScale=Math.min(cw*(1-2*padFrac)/mapBB.w, (ch-topPx-botPx)*(1-2*padFrac)/mapBB.h);
    MIN_SCALE=fitScale;
    MAX_SCALE=fitScale*8;   // запас, чтобы подсказка (x6.4) помещалась под потолок зума
    if(!camReady || camScale<MIN_SCALE-1e-6){
      camReady=true;
      applyCam(fitScale, mapBB.x+mapBB.w/2, mapBB.y+mapBB.h/2 - FIT_DY/fitScale);
      clampCam();
    } else { clampCam(); }
  }
  function tweenCam(now){
    var k=Math.min(1,(now-hintT0)/HINT_TWEEN_MS);
    var e=easeInOutCubic(k);
    var sc=camFrom.scale*Math.pow(camTo.scale/camFrom.scale,e);
    applyCam(sc,
      camFrom.cx+(camTo.cx-camFrom.cx)*e,
      camFrom.cy+(camTo.cy-camFrom.cy)*e);
    return k>=1;
  }
  function worldBBoxOfPaths(){
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,i,j,pts;
    for(i=0;i<paths.length;i++){
      pts=paths[i].points||[];
      for(j=0;j<pts.length;j++){
        if(pts[j].x<minX)minX=pts[j].x;
        if(pts[j].x>maxX)maxX=pts[j].x;
        if(pts[j].y<minY)minY=pts[j].y;
        if(pts[j].y>maxY)maxY=pts[j].y;
      }
    }
    var dec=DECOR.outline.concat(DECOR.curl);
    for(j=0;j<dec.length;j++){ if(dec[j][0]<minX)minX=dec[j][0]; if(dec[j][0]>maxX)maxX=dec[j][0]; if(dec[j][1]<minY)minY=dec[j][1]; if(dec[j][1]>maxY)maxY=dec[j][1]; }
    if(!isFinite(minX))return null;
    return { x:minX, y:minY, w:Math.max(1,maxX-minX), h:Math.max(1,maxY-minY) };
  }
  function railMidPoint(p){
    ensurePathRails(p);

    var rail=rc&&rc.pick?rc.pick:null;
    if(!rail||rail.length<2){
      var pts=p.points||[];
      return pts.length?{ x:pts[0].x, y:pts[0].y }:null;
    }
    var cum=cumLen(rail);
    return pointAtS(rail,cum,cum[cum.length-1]*0.5);
  }

  function findHintPathId(){

  /* canPathClearNow() дорогая: сортируем кандидатов и ограничиваем бюджет вызовов */
  function pickHintPath(budget){
    var cam=currentCam(),i,mp,cand=[];
    for(i=0;i<paths.length;i++){
      mp=railMidPoint(paths[i]);
      if(!mp)continue;
      cand.push({ p:paths[i], mp:mp, d:Math.hypot(mp.x-cam.cx,mp.y-cam.cy)*0.35+mp.y });

    cand.sort(function(a,b){ return a.d-b.d; });
    var lim=Math.min(cand.length,budget||26);
    for(i=0;i<lim;i++){

    var fid=findHintPathId();
    if(fid){
      for(i=0;i<paths.length;i++){

      if(pinchDist0<1e-6)pinchDist0=1e-6;
      pinchScale0=camScale;
      pinchMid0=clientToInternal((t0.clientX+t1.clientX)/2,(t0.clientY+t1.clientY)/2);
      pinchPan0={ x:camPanX,y:camPanY };
      cancelHint();
    }
  },{passive:false});
  cv.addEventListener('touchmove',function(ev){
    if(ev.touches.length===1&&!pinchActive){
      ev.preventDefault();
      moveDrag(ev.touches[0].clientX,ev.touches[0].clientY);
      return;
    }
    if(ev.touches.length!==2)return;
    ev.preventDefault();
    lastPinchTime=Date.now();
    lastInputAt=Date.now();
    var t0=ev.touches[0],t1=ev.touches[1];
    var d=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    if(pinchDist0<1e-6)return;
    var mid=clientToInternal((t0.clientX+t1.clientX)/2,(t0.clientY+t1.clientY)/2);
    var ns=Math.max(MIN_SCALE,Math.min(MAX_SCALE,pinchScale0*(d/pinchDist0)));
    var wf={ x:(pinchMid0.x-pinchPan0.x)/pinchScale0,y:(pinchMid0.y-pinchPan0.y)/pinchScale0 };
    camScale=ns;
    camPanX=mid.x-ns*wf.x;
    camPanY=mid.y-ns*wf.y;
    clampCam();
  },{passive:false});
  function onTouchEnd(ev){
    ev.preventDefault();
    if(pinchActive){
      if(ev.touches.length===0){ pinchActive=false; lastPinchTime=Date.now(); }
      dragActive=false; dragMoved=false;
      return;
    }
    var t=ev.changedTouches&&ev.changedTouches.length?ev.changedTouches[0]:null;
    if(!t){ dragActive=false; dragMoved=false; return; }
    endDrag(t.clientX,t.clientY,true);
  }
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',function(){ dragActive=false; dragMoved=false; pinchActive=false; },{passive:true});
  window.addEventListener('resize',function(){ layout(); });
  window.addEventListener('orientationchange',function(){ setTimeout(layout,120); });
  for(var warmI=0;warmI<paths.length;warmI++){
    if(paths[warmI]&&paths[warmI].id)ensurePathRails(paths[warmI]);
  }
  layout();
  loop();
  armAudioGestures();   // звук/музыка — с первого жеста пользователя
  /* (Mintegral SDK hooks не нужны в этой сборке) */
})();
</script>
