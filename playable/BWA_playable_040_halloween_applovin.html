<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halloween Associations</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12031f;font-family:Poppins,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;flex-direction:column;align-items:stretch;
gap:clamp(4px,1vh,8px);padding:max(8px,1.2vh) clamp(8px,2.5vw,14px);pointer-events:none}
#hudtop{display:flex;justify-content:space-between;align-items:center;gap:clamp(6px,1.5vw,12px);width:100%}
#hudlogo{height:clamp(34px,7.5vh,52px);width:auto;flex:0 0 auto;pointer-events:auto;border-radius:0;
box-shadow:0 4px 10px rgba(0,0,0,.55)}
#hudcap{display:flex;justify-content:center;align-items:center;width:100%;pointer-events:none;visibility:hidden}
#hudcaptext{display:inline-block;max-width:min(92vw,520px);box-sizing:border-box;font-weight:800;font-size:clamp(12px,2.8vh,20px);
line-height:1.15;padding:clamp(6px,1.2vh,10px) clamp(12px,3.5vw,22px);border-radius:999px;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;text-align:center;border:3px solid #b4ff3a;box-shadow:0 0 18px rgba(120,255,80,.75),0 4px 12px rgba(0,0,0,.45);
background:linear-gradient(180deg,#2c9a48,#0b3f1e);color:#eaffd0}
#hudcta{flex:0 0 auto;pointer-events:auto;background:linear-gradient(180deg,#63e873,#1f9e34);color:#04310f;
font-weight:800;font-size:clamp(11px,2.4vh,13px);padding:clamp(7px,1.4vh,9px) clamp(12px,3vw,18px);border:2px solid #ff9a2e;border-radius:22px;cursor:pointer;
text-transform:uppercase;letter-spacing:.5px;box-shadow:0 4px 0 #3a1660,0 0 12px rgba(255,138,26,.55),0 6px 14px rgba(0,0,0,.45);white-space:nowrap}
#end{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
justify-content:center;text-align:center;padding:clamp(10px,3vh,24px) clamp(12px,4vw,24px);cursor:pointer;
background:rgba(18,3,31,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);gap:clamp(6px,1.5vh,14px)}
#end img{width:min(42vw,28vh,220px);max-width:220px;height:auto;margin-bottom:0;border-radius:0;
box-shadow:none;filter:drop-shadow(0 14px 24px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,138,26,.45))}
#end .t{color:#fff;font-weight:800;font-size:clamp(16px,4.2vh,26px);line-height:1.25;margin-bottom:0;text-shadow:0 2px 12px rgba(0,0,0,.7);max-width:90vw}
#playbtn{background:linear-gradient(180deg,#69ee7a,#1f9e34);color:#04310f;font-weight:900;
font-size:clamp(15px,3.6vh,26px);padding:clamp(10px,2.2vh,18px) clamp(22px,6vw,48px);border:3px solid #ff9a2e;border-radius:999px;cursor:pointer;text-transform:uppercase;
letter-spacing:1px;box-shadow:0 6px 0 #3a1660,0 0 18px rgba(255,138,26,.6),0 12px 28px rgba(0,0,0,.55);animation:bob 1.1s ease-in-out infinite;max-width:90vw}
@media (orientation:landscape) and (max-height:500px){
#hud{padding:6px 10px;gap:4px}
#hudlogo{height:clamp(28px,9vh,40px)}
#hudcaptext{font-size:clamp(10px,3.2vh,15px);padding:4px 12px}
#hudcta{font-size:clamp(10px,3vh,12px);padding:6px 12px}
#end{flex-direction:row;flex-wrap:wrap;align-content:center;gap:10px 18px;padding:10px 16px}
#end img{width:min(18vw,22vh,120px);max-width:120px}
#end .t{font-size:clamp(14px,4.5vh,22px);flex:1 1 180px;text-align:left;margin:0}
#playbtn{font-size:clamp(13px,4vh,18px);padding:10px 28px;box-shadow:0 4px 0 #12631f,0 8px 18px rgba(0,0,0,.5)}
}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

<script>/*
 * Bubble Associations — Game Engine
 * ---------------------------------
 * Real physics driven by Matter.js (like the AE "Newton" plugin): every word
 * lives inside a soft floating bubble that collides with its neighbours.
 *
 * Interaction (drag-to-merge):
 *   - Grab a bubble and drag it. A solid copy (the clear.png glass sphere + its
 *     word) follows the pointer, while a semi-transparent "ghost" stays at the
 *     original spot.
 *   - Drop it onto another bubble of the SAME category → the two soft bubbles
 *     merge: the target swells, squashes like jelly and its word list grows.
 *   - Drop it anywhere else → the copy springs back home (the ghost is restored).
 *   - When a bubble reaches 4 words of a category it turns big, recolours, the
 *     words morph into the category name and it pops — a comet-tail of bubbles
 *     streaks up to the title. Then the next category can be assembled.
 *
 * The bubble art is the clear.png glass sphere, tinted per category. The same
 * class powers the constructor preview, the exported playable and the
 * deterministic recorder that feeds the After Effects export.
 */

var END_CAT="DECORATIONS";
var canvas=document.getElementById("game");
if(LOGO){var hl=document.getElementById("hudlogo");if(hl)hl.src=LOGO;var el2=document.getElementById("endlogo");if(el2)el2.src=LOGO;}
var _mraidReady=false;
function _onMraidReady(){ _mraidReady=true; }
if(window.mraid){ try{ if(mraid.getState()==="loading"){ mraid.addEventListener("ready",_onMraidReady); } else { _onMraidReady(); } }catch(e){ _onMraidReady(); } }
function clickOut(){ try{ if(window.mraid&&_mraidReady){mraid.open(CTA_URL);return;} }catch(e){}
  try{ if(window.FbPlayableAd){FbPlayableAd.onCTAClick();return;} }catch(e){}
  window.open(CTA_URL,"_blank"); }
var _ended=false;
function showEnd(){ if(_ended)return; _ended=true; document.getElementById("end").style.display="flex"; }
document.getElementById("hudcta").onclick=clickOut;
document.getElementById("playbtn").onclick=clickOut;
document.getElementById("end").onclick=function(e){ if(e.target.id!=="playbtn") clickOut(); };
var game=new BubbleGame(canvas,CONFIG,{
  tutorial:true, handImage:HAND, noExternal:true, hoverSound:(HOVER||null), batImages:[BAT1,BAT2], batSound:BATWINGS, decoImages:{web:WEB,spider:SPIDER,eyes:EYES},
  onCategorySolved:function(c){ if(c&&c.name&&END_CAT&&c.name.toUpperCase().indexOf(END_CAT)>=0) setTimeout(showEnd,650); },
  onWin:showEnd });
function fit(){ var w=window.innerWidth,h=window.innerHeight; canvas.style.width=w+"px"; canvas.style.height=h+"px"; if(game.engine)game.resize(); }
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);
function _setVisible(v){ try{ if(v){ if(game._actx&&game._actx.resume)game._actx.resume(); game.start&&game.start(); } else { game.stop&&game.stop(); if(game._actx&&game._actx.suspend)game._actx.suspend(); } }catch(e){} }
document.addEventListener("visibilitychange",function(){ _setVisible(!document.hidden); });
try{ if(window.mraid){ mraid.addEventListener("viewableChange",function(v){ _setVisible(!!v); }); } }catch(e){}
game.load(); fit(); game.start(); setTimeout(fit,60); setTimeout(fit,400);
</script>
