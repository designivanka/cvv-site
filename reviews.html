<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reviews board — Ivanova Yanina</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0a0c; --text:#f4f4f5; --muted:#a1a1aa; --cyan:#5eead4; --border:rgba(255,255,255,.08); --dock:132px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height:100vh; padding-bottom:calc(var(--dock) + 10px);
    background-image: radial-gradient(800px 500px at 10% -10%, rgba(167,139,250,.12), transparent 60%), radial-gradient(700px 500px at 100% 0%, rgba(94,234,212,.08), transparent 60%); }
  a { color:inherit; text-decoration:none; }
  button, input, textarea { font-family:inherit; }
  .wrap { width:min(1280px, 94vw); margin:0 auto; }
  header { position:sticky; top:0; z-index:30; backdrop-filter:blur(14px); background:rgba(10,10,12,.72); border-bottom:1px solid var(--border); }
  .bar { display:flex; align-items:center; justify-content:space-between; height:62px; gap:1rem; }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.05rem; }
  .logo small { display:block; font-family:'DM Sans'; font-weight:500; font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .actions { display:flex; gap:.45rem; align-items:center; }
  .pill { font-size:.78rem; font-weight:600; padding:.5rem .9rem; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:none; cursor:pointer; transition:color .2s,border-color .2s,background .2s; }
  .pill:hover { color:var(--cyan); border-color:rgba(94,234,212,.4); }
  .lang button.is-active { color:var(--bg); background:var(--cyan); border-color:var(--cyan); }
  .live { display:inline-flex; align-items:center; gap:.4rem; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#86efac; }
  .live i { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.6); animation:pulse 1.8s infinite; }
  .live.is-off { color:var(--muted); } .live.is-off i { background:#71717a; animation:none; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow:0 0 0 0 rgba(34,197,94,0); } }

  .hero { padding:2rem 0 1.1rem; }
  .eyebrow { font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:#fbbf24; font-weight:700; }
  h1 { font-family:'Syne',sans-serif; font-size:clamp(2rem,5vw,3.2rem); line-height:1.02; letter-spacing:-.03em; margin:.5rem 0 .7rem; }
  h1 span { font-family:'Caveat',cursive; font-weight:700; color:#fde68a; font-size:1.15em; letter-spacing:0; }
  .lead { color:var(--muted); max-width:720px; line-height:1.6; }
  .admin-bar { display:none; margin:.7rem 0 0; padding:.6rem .9rem; border-radius:10px; background:rgba(220,38,38,.12); border:1px solid rgba(220,38,38,.35); font-size:.82rem; }
  body.is-admin .admin-bar { display:inline-block; }

  /* ---- board ---- */
  .board-scroll { overflow-x:auto; padding-bottom:.5rem; -webkit-overflow-scrolling:touch; }
  .board { position:relative; width:100%; min-width:980px; height:700px; border-radius:14px; overflow:hidden;
    border:22px solid #b07a3c; border-image:url(./reviews/board.jpg) 31 33 31 33 / 22px stretch;
    background:url(./reviews/cork.jpg) 0 0/640px auto repeat; box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 6px 18px rgba(0,0,0,.45); }
  .board::after { content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 8px 20px rgba(0,0,0,.35); }
  .stage { position:absolute; left:0; top:0; width:1600px; height:1200px; transform-origin:0 0; }
  .notes { position:absolute; inset:0; pointer-events:none; }
  canvas.paint { position:absolute; left:0; top:0; width:1600px; touch-action:pan-y; }
  body.is-drawing canvas.paint { touch-action:none; cursor:none; }
  body.is-drawing .note { pointer-events:none; }
  body.is-admin:not(.is-drawing) canvas.paint { cursor:crosshair; }
  .more { text-align:center; color:var(--muted); font-size:.8rem; margin-top:.6rem; }
  .empty { position:absolute; left:50%; top:300px; transform:translate(-50%,-50%) rotate(-3deg); font-family:'Caveat',cursive; font-size:44px; color:rgba(255,255,255,.92); text-shadow:0 3px 12px rgba(0,0,0,.5); text-align:center; pointer-events:none; line-height:1.1; }

  /* ---- notes ---- */
  .note { position:absolute; width:272px; height:280px; transform:translate(-50%,-50%) rotate(var(--rot,0deg)); filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)); transition:transform .25s; z-index:2; pointer-events:auto; touch-action:none; }
  .note:hover, .note.is-editing { transform:translate(-50%,-50%) rotate(0deg) scale(1.04); z-index:6; }
  .note.is-new { animation:stick .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stick { 0% { transform:translate(-50%,-50%) rotate(-14deg) scale(1.25); } 100% { transform:translate(-50%,-50%) rotate(0) scale(1.04); } }
  .note.is-mine { cursor:grab; }
  .note.is-dragging { cursor:grabbing; transition:none; z-index:9; }
  .note__paper { position:absolute; inset:0; background:url(./reviews/note.webp) center/100% 100% no-repeat; }
  .c-pink { filter:hue-rotate(-62deg) saturate(1.9) brightness(1.02); }
  .c-mint { filter:hue-rotate(95deg) saturate(1.5); }
  .c-blue { filter:hue-rotate(160deg) saturate(1.6); }
  .c-lavender { filter:hue-rotate(215deg) saturate(1.4); }
  .c-peach { filter:hue-rotate(-28deg) saturate(1.8); }
  .note__pin { position:absolute; left:50%; top:-24px; width:40px; transform:translateX(-50%) rotate(8deg); filter:drop-shadow(2px 6px 3px rgba(0,0,0,.35)); pointer-events:none; }
  .note__body { position:absolute; left:22px; right:24px; top:26px; bottom:22px; display:flex; flex-direction:column; color:#2b2214; font-family:'Caveat',cursive; }
  .note__text { font-size:26px; line-height:1.05; font-weight:500; overflow:hidden; flex:1; word-break:break-word; white-space:pre-wrap; }
  .note--long .note__text { font-size:21px; }
  .note__sign { font-size:22px; font-weight:700; line-height:1; margin-top:6px; }
  .note__sign small { display:block; font-size:16px; font-weight:500; opacity:.8; margin-top:2px; }
  .note textarea, .note input { background:transparent; border:0; outline:none; color:#2b2214; font-family:'Caveat',cursive; width:100%; }
  .note textarea { flex:1; resize:none; font-size:25px; line-height:1.05; font-weight:500; }
  .note input { font-size:20px; line-height:1.1; border-bottom:1px dashed rgba(43,34,20,.28); padding:1px 0; }
  .note input.n { font-size:22px; font-weight:700; }
  .note input.bad { border-bottom-color:#dc2626; }
  .note textarea::placeholder, .note input::placeholder { color:rgba(43,34,20,.42); }
  .note .row { display:flex; gap:6px; }
  .note__typing { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:26px; color:rgba(43,34,20,.55); }
  .note__typing b { animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .note__bar { position:absolute; left:50%; top:calc(100% + 10px); transform:translateX(-50%); display:flex; gap:6px; align-items:center; white-space:nowrap; font-family:'DM Sans'; }
  .note__bar span { font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; background:#111; color:#fde68a; }
  .note__bar span.ok { color:#86efac; }
  .note__bar button { border:0; cursor:pointer; font-weight:700; font-size:13px; padding:6px 11px; border-radius:999px; background:#fde68a; color:#3b2a00; box-shadow:0 4px 10px rgba(0,0,0,.4); }
  .note__bar button.del { background:#dc2626; color:#fff; }
  .note__x { position:absolute; top:-12px; right:-12px; width:30px; height:30px; border-radius:50%; border:0; cursor:pointer; font-weight:800; color:#fff; background:#dc2626; box-shadow:0 4px 10px rgba(0,0,0,.4); z-index:3; }

  /* ---- dock: sticky pad + tools standing at the bottom ---- */
  .dock { position:fixed; left:0; right:0; bottom:0; height:var(--dock); z-index:40; pointer-events:none; }
  .dock::before { content:''; position:absolute; left:0; right:0; bottom:0; height:44px; background:linear-gradient(180deg, rgba(10,10,12,0), rgba(10,10,12,.85)); }
  .dock__in { position:relative; height:100%; width:min(1280px, 100vw); margin:0 auto; display:flex; align-items:flex-end; gap:6px; padding:0 14px; }
  .pad { position:relative; width:122px; height:116px; flex:none; pointer-events:auto; margin-right:10px; }
  .pad__stack { position:absolute; left:6px; bottom:-26px; width:112px; height:116px; cursor:grab; touch-action:none; transition:transform .2s; }
  .pad__stack:hover { transform:translateY(-8px) rotate(-2deg); }
  .pad__stack div { position:absolute; inset:0; background:url(./reviews/note.webp) center/100% 100% no-repeat; filter:drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  .pad__stack div:nth-child(1) { transform:translate(5px,8px) rotate(4deg); }
  .pad__stack div:nth-child(2) { transform:translate(-3px,4px) rotate(-3deg); }
  .pad__stack div:nth-child(3) { transform:rotate(1deg); }
  .pad__stack em { position:absolute; left:14px; right:14px; top:22px; font-family:'Caveat',cursive; font-style:normal; font-size:19px; line-height:1; color:rgba(43,34,20,.65); text-align:center; }
  .pad__colors { position:absolute; left:2px; top:-12px; display:flex; gap:4px; }
  .pad__colors button { width:17px; height:17px; border-radius:50%; border:2px solid rgba(0,0,0,.4); cursor:pointer; }
  .pad__colors button.is-active { border-color:#fff; transform:scale(1.2); }
  .tools { display:flex; align-items:flex-end; gap:0; height:100%; flex:1; }
  .tool { position:relative; width:64px; height:100%; flex:none; pointer-events:auto; cursor:pointer; background:none; border:0; }
  .tool img { position:absolute; left:50%; bottom:-58px; width:132px; transform:translateX(-50%) rotate(var(--r)); transition:transform .25s cubic-bezier(.3,1.5,.5,1), opacity .2s; filter:drop-shadow(0 6px 6px rgba(0,0,0,.55)); pointer-events:none; }
  .tool:hover img { transform:translateX(-50%) translateY(-16px) rotate(var(--r)); }
  .tool.is-active img { transform:translateX(-50%) translateY(-40px) rotate(var(--r)); opacity:.28; }
  .tool span { position:absolute; left:50%; bottom:calc(100% - 6px); transform:translateX(-50%); font-size:.68rem; font-weight:600; white-space:nowrap; padding:3px 8px; border-radius:999px; background:#111; color:#fde68a; opacity:0; transition:opacity .2s; pointer-events:none; }
  .tool:hover span, .tool.is-active span { opacity:1; }
  .dock__right { display:flex; flex-direction:column; gap:6px; margin-left:auto; padding-bottom:16px; pointer-events:auto; }
  .dbtn { border:1px solid rgba(255,255,255,.18); background:rgba(17,17,20,.85); color:var(--text); font-size:.78rem; font-weight:600; padding:.5rem .85rem; border-radius:999px; cursor:pointer; white-space:nowrap; backdrop-filter:blur(8px); }
  .dbtn:hover { border-color:var(--cyan); color:var(--cyan); }
  .dbtn[hidden] { display:none; }
  .tool-cursor { position:fixed; z-index:50; width:72px; pointer-events:none; display:none; filter:drop-shadow(3px 6px 4px rgba(0,0,0,.45)); }
  .ghost { position:fixed; z-index:60; pointer-events:none; transform:translate(-50%,-50%) rotate(-8deg); filter:drop-shadow(0 18px 18px rgba(0,0,0,.5)); }
  .ghost div { position:absolute; inset:0; background:url(./reviews/note.webp) center/100% 100% no-repeat; }

  .hp { position:absolute; left:-9999px; }
  .toast { position:fixed; left:50%; bottom:calc(var(--dock) + 12px); transform:translateX(-50%) translateY(20px); opacity:0; z-index:80; background:#111; color:#fde68a; border:1px solid rgba(253,230,138,.35); padding:.75rem 1.15rem; border-radius:999px; font-weight:600; font-size:.88rem; transition:all .3s; pointer-events:none; max-width:92vw; text-align:center; }
  .toast.is-on { opacity:1; transform:translateX(-50%) translateY(0); }
  footer { color:var(--muted); font-size:.8rem; padding:1.6rem 0 1rem; }
  @media (max-width:640px) {
    :root { --dock:112px; }
    .pad { width:92px; } .pad__stack { width:86px; height:90px; bottom:-18px; } .pad__stack em { font-size:15px; top:16px; }
    .tool { width:44px; } .tool img { width:100px; bottom:-46px; }
    .dock__in { padding:0 8px; gap:2px; }
    .dbtn { font-size:.7rem; padding:.4rem .6rem; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="./">Ivanova Yanina<small>Motion Designer</small></a>
    <div class="actions">
      <span class="live is-off" id="live"><i></i><b>Live</b></span>
      <a class="pill" href="./" data-i18n="back">← На сайт</a>
      <span class="lang"><button class="pill" data-lang="en">EN</button> <button class="pill" data-lang="ru">RU</button></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow" data-i18n="eyebrow">Отзывы</p>
    <h1 data-i18n="title">Доска <span>отзывов</span></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="admin-bar" data-i18n="adminbar"></div>
  </section>

  <div class="board-scroll">
    <div class="board" id="board">
      <div class="stage" id="stage">
        <canvas class="paint" id="paint" width="1600" height="1200"></canvas>
        <div class="notes" id="notes"></div>
      </div>
      <div class="empty" id="empty" data-i18n="empty"></div>
    </div>
  </div>
  <p class="more" data-i18n="more"></p>
</main>
<footer class="wrap" data-i18n="footer"></footer>

<div class="dock">
  <div class="dock__in">
    <div class="pad" id="pad">
      <div class="pad__colors" id="padColors"></div>
      <div class="pad__stack" id="padStack"><div></div><div></div><div><em data-i18n="peel"></em></div></div>
    </div>
    <div class="tools" id="tools"></div>
    <div class="dock__right">
      <button class="dbtn" id="btnUndo" type="button" hidden data-i18n="undo">↶ Отменить</button>
      <button class="dbtn" id="btnHand" type="button" hidden data-i18n="hand">✋ Положить</button>
    </div>
  </div>
</div>

<img class="tool-cursor" id="toolCursor" alt="" />
<div class="toast" id="toast"></div>

<script>
(function () {
  var API = '/api/reviews';
  var W = 1600, NOTE_W = 272, NOTE_H = 280;
  var I18N = {
    ru: { back:'← На сайт', eyebrow:'Отзывы', title:'Доска <span>отзывов</span>',
      lead:'Работали со мной? Отклейте стикер из стопки внизу, приклейте на доску и напишите отзыв. Или возьмите маркер, мел, баллончик — и рисуйте прямо на доске. Всё появляется у всех сразу, в реальном времени ✨',
      empty:'Здесь пока пусто —<br>будьте первым ✨', more:'↓ Доска бесконечная — листайте вниз, места хватит всем',
      footer:'Отзыв появляется на доске, когда заполнены текст, имя, компания и должность.',
      peel:'отклей меня', undo:'↶ Отменить штрих', hand:'✋ Положить',
      textPh:'Ваш отзыв: как работалось, что получилось…', namePh:'Имя Фамилия *', rolePh:'Должность *', companyPh:'Компания *',
      draft:'черновик — видите только вы', live:'✓ на доске', done:'📌 Готово', del:'Удалить', typing:'кто-то пишет',
      needSign:'Допишите отзыв, имя, должность и компанию — и стикер появится у всех', posted:'Готово! Стикер на доске 💛',
      dropHint:'Перетащите стикер на доску', errNet:'Нет связи, повторим…', errRate:'Слишком много за час — попробуйте позже',
      adminbar:'Админ: ✕ на стикере — удалить; клик по рисунку на доске — удалить штрих.', confirmDel:'Удалить?',
      tools:{ marker:'Маркер', chalk:'Мел', brush:'Краска', spray:'Баллончик', pencil:'Карандаш', glitter:'Глиттер', neon:'Неон' } },
    en: { back:'← Back to site', eyebrow:'Reviews', title:'Reviews <span>board</span>',
      lead:'Worked with me? Peel a sticky note off the pad below, stick it on the board and write your review. Or grab a marker, chalk or spray can and draw right on the board. Everyone sees it instantly, in real time ✨',
      empty:'Nothing here yet —<br>be the first ✨', more:'↓ The board is endless — scroll down, there is room for everyone',
      footer:'A note shows up for everyone once the text, name, company and position are filled in.',
      peel:'peel me off', undo:'↶ Undo stroke', hand:'✋ Put down',
      textPh:'Your review: what it was like, what we achieved…', namePh:'First Last *', rolePh:'Position *', companyPh:'Company *',
      draft:'draft — only you see it', live:'✓ on the board', done:'📌 Done', del:'Delete', typing:'someone is writing',
      needSign:'Add the review, your name, position and company — then everyone will see it', posted:'Done! Your note is on the board 💛',
      dropHint:'Drag the note onto the board', errNet:'Connection lost, retrying…', errRate:'Too many in an hour — try again later',
      adminbar:'Admin: ✕ on a note deletes it; click a drawing on the board to delete that stroke.', confirmDel:'Delete?',
      tools:{ marker:'Marker', chalk:'Chalk', brush:'Paint', spray:'Spray', pencil:'Pencil', glitter:'Glitter', neon:'Neon' } }
  };
  var COLORS = { yellow:'#fde68a', pink:'#f9a8d4', mint:'#a7f3d0', blue:'#bae6fd', lavender:'#ddd6fe', peach:'#fdba74' };
  var PINS = ['red','yellow','mint','pink','blue','purple'];
  var TOOLS = [
    { id:'marker', tip:'tr' }, { id:'chalk', tip:'tr' }, { id:'brush', tip:'tr' }, { id:'spray', tip:'tr' },
    { id:'pencil', tip:'tr' }, { id:'glitter', tip:'bl' }, { id:'neon', tip:'bl' }
  ];

  var params = new URLSearchParams(location.search);
  var lang = params.get('lang');
  if (lang !== 'ru' && lang !== 'en') { try { lang = localStorage.getItem('cvv-lang'); } catch (e) {} }
  if (lang !== 'ru' && lang !== 'en') lang = 'ru';
  function T() { return I18N[lang]; }

  var board = document.getElementById('board'), stage = document.getElementById('stage');
  var notesEl = document.getElementById('notes'), emptyEl = document.getElementById('empty');
  var canvas = document.getElementById('paint'), ctx = canvas.getContext('2d');
  var toastEl = document.getElementById('toast'), liveEl = document.getElementById('live');
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('is-on'); clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.classList.remove('is-on'); }, 3400); }

  // ---------- state ----------
  var items = {};            // id -> item (strokes + notes) from server
  var mine = {};             // id -> { token, type, draft? }
  try { mine = JSON.parse(localStorage.getItem('cvv-live-mine') || '{}') || {}; } catch (e) {}
  function saveMine() { try { localStorage.setItem('cvv-live-mine', JSON.stringify(mine)); } catch (e) {} }
  var adminKey = null;
  if (params.has('admin')) {
    try { adminKey = localStorage.getItem('cvv-admin-key'); } catch (e) {}
    if (!adminKey) adminKey = prompt('Admin key');
    if (adminKey) { try { localStorage.setItem('cvv-admin-key', adminKey); } catch (e) {} document.body.classList.add('is-admin'); }
  }

  // ---------- scale + endless height ----------
  var H = 1200, S = 1;
  function fit() {
    S = board.clientWidth / W;
    stage.style.transform = 'scale(' + S + ')';
    stage.style.height = H + 'px'; canvas.style.height = H + 'px';
    board.style.height = Math.round(H * S + 44) + 'px';
  }
  function setH(nh) {
    nh = Math.ceil(nh / 300) * 300;
    if (nh <= H) return;
    var keep = document.createElement('canvas'); keep.width = W; keep.height = H; keep.getContext('2d').drawImage(canvas, 0, 0);
    canvas.height = nh; ctx.drawImage(keep, 0, 0); H = nh; fit();
  }
  function ensureH() {
    var bottom = 0;
    Object.keys(items).forEach(function (id) { var it = items[id];
      if (it.type === 'note') bottom = Math.max(bottom, it.y + 160);
      else for (var i = 1; i < it.pts.length; i += 2) if (it.pts[i] > bottom) bottom = it.pts[i]; });
    setH(Math.max(1200, bottom + 900));
  }
  window.addEventListener('resize', fit); fit();
  function stagePoint(ev) { var r = stage.getBoundingClientRect(), s = r.width / W; return { x:(ev.clientX - r.left) / s, y:(ev.clientY - r.top) / s }; }

  // ---------- network ----------
  function post(payload, admin) {
    var h = { 'content-type':'application/json' }; if (admin && adminKey) h['x-admin-key'] = adminKey;
    return fetch(API, { method:'POST', headers:h, body:JSON.stringify(payload) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'err'); e.code = r.status; throw e; } return d; });
    });
  }
  var since = 0, polling = false, pollTimer = null, fails = 0;
  function poll() {
    if (polling) return; polling = true;
    var url = API + '?since=' + since + (adminKey ? '&admin=1' : '');
    fetch(url, { cache:'no-store', headers: adminKey ? { 'x-admin-key':adminKey } : {} }).then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (d) {

    }).catch(function (e) { toast(e.code === 429 ? T().errRate : T().errNet); deleteMyNote(tmp); });
  }

  // ---------- i18n ----------
  function applyLang() {
    var t = T(); document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (e) { var v = t[e.getAttribute('data-i18n')]; if (v != null) e.innerHTML = v; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-lang') === lang); });
    toolsEl.querySelectorAll('.tool').forEach(function (b) { b.querySelector('span').textContent = t.tools[b.dataset.tool]; b.setAttribute('aria-label', t.tools[b.dataset.tool]); });
    Object.keys(items).forEach(function (id) { if (items[id].type === 'note') renderNote(items[id]); });
  }
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); try { localStorage.setItem('cvv-lang', lang); } catch (e) {} applyLang(); }); });

  applyLang(); syncEmpty(); poll();
})();
</script>
</body>
</html>
